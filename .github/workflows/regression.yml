name: E2E regression

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Any future deployment job must depend on this job's success.
  regression:
    name: TypeScript, build, and Playwright gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: |
          pnpm --filter @closet/api db:generate
          pnpm --filter @closet/types typecheck
          pnpm --filter @closet/api typecheck
          pnpm --filter @closet/web exec tsc -b --noEmit
          pnpm typecheck:e2e

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E regression tests
        run: pnpm test:e2e

      - name: Upload failure report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
